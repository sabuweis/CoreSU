name: Build Full CoreSU
on: workflow_dispatch
jobs:
  build-lkm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi: [android14-6.1, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - run: |
        cd kernel
        CONFIG_KSU=m CC=clang make
        cp kernelsu.ko /tmp/${{ matrix.kmi }}_kernelsu.ko
    - uses: actions/upload-artifact@v4
      with:
        name: lkm-${{ matrix.kmi }}
        path: /tmp/${{ matrix.kmi }}_kernelsu.ko

  build-apk:
    needs: build-lkm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: lkm-*
        path: ./all-lkm
        merge-multiple: true
    - run: |
        mkdir -p userspace/ksud/bin/aarch64
        cp all-lkm/*.ko userspace/ksud/bin/aarch64/
        rm -rf manager/app/src/main/cpp/uapi
        cp -r uapi manager/app/src/main/cpp/uapi
    - uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '21' }

    - uses: dtolnay/rust-toolchain@master

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with: { ndk-version: r29 }

    - name: Export NDK Environment
      run: |
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        rm -f manager/local.properties
        echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > manager/local.properties

    - name: Build Rust
      run: |
        mkdir -p userspace/ksud/bin/aarch64
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
        export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
        cargo build --package ksuinit --target=aarch64-linux-android --release
        cp target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/
        cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
        mkdir -p manager/app/src/main/jniLibs/arm64-v8a
        cp target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so

    - name: Sign APK
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/mykey.jks
        cd manager && chmod +x gradlew
        ./gradlew :app:assembleRelease \
          -PKEYSTORE_FILE="$GITHUB_WORKSPACE/mykey.jks" \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          -PKSU_NAME=CoreSU -PKSU_PACKAGE_NAME=me.li.coresu

    - uses: actions/upload-artifact@v4
      with:
        name: CoreSU-APK
        path: manager/app/build/outputs/apk/release/*.apk
